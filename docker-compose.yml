# Interpolates DB_* from the shared .env.development: docker compose --env-file .env.development up -d
services:
  postgres:
    image: postgres:18
    container_name: cms-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:?}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      # postgres 18+ keeps PGDATA in a versioned subdirectory, so mount the parent
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
