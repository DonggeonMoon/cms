services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CMS_DB_NAME:?}
      POSTGRES_USER: ${CMS_DB_USER:?}
      POSTGRES_PASSWORD: ${CMS_DB_PASSWORD:?}
      # PostgreSQL 과 pg_isready 모두 PGPORT 를 읽어 앱이 붙는 포트로 뜬다.
      PGPORT: ${CMS_DB_PORT:-5432}
    ports:
      - "127.0.0.1:${CMS_DB_PORT:-5432}:${CMS_DB_PORT:-5432}"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  uploads:
